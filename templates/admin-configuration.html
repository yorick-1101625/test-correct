<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='general.css') }}">
</head>
<body>
<div class="shape">
  <img src="https://www.test-correct.nl/hubfs/02%20TC%20assets%20-%20illustrations/TC-on-devices-v4.svg">
</div>

    <header>
        <h1>Hier kan een redacteur alles wijzigen.</h1>
    </header>

    <table>
      <tr>
        <th>Redacteur</th>
        <th>Loginnaam</th>
        <th>Admin</th>
        <th>Acties</th>
      </tr>

        {% for user in users %}
      <tr>
        <td>{{user.display_name}}</td>
        <td>{{user.login}}</td>
          {% if user.is_admin == 1 %}
            <td><input type="checkbox" id="admin" name="admin" disabled checked></td>
          {% else %}
            <td><input type="checkbox" id="admin" name="admin" disabled></td>
          {% endif %}
        <td>
            <a href="/admin/edit-user/{{user.user_id}}">
            <button type="button">Wijzig</button>
            </a>
        </td>
      </tr>

        {% endfor %}
</table>

<a href="/admin/edit-active-user">
    <button>Wijzig eigen gegevens</button>
</a>

<a href="/admin/create-user">
    <button>Nieuwe redacteur</button>
</a>
</body>
</html>
